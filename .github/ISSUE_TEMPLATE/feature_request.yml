name: 💡 Feature Request
description: Suggest an idea or enhancement for WhatsApp Auto-Responder
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      placeholder: What feature would you like to see added? (e.g. Telegram/Signal support, new personality tones, contact blacklist)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Use Case & Context
      placeholder: How would this help your day-to-day workflow?
